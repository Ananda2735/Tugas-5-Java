
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Manajemen Produk Toko Online</h1>
        <p>Kelola daftar produk toko dengan mudah.</p>

        <div class="form-produk">
            <h2>Tambah Produk</h2>
            <input type="text" id="namaProduk" placeholder="Nama produk">
            <input type="number" id="hargaProduk" placeholder="Harga produk">
            <button id="tambahBtn">Tambah Produk</button>
        </div>

        <div class="daftar">
            <h2>Daftar Produk</h2>
            <div id="listProduk"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
